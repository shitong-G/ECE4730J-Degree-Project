# Raspberry Pi 4 (4GB) profile
extends: default.yaml

device:
  platform: raspberry_pi4
  cpu_count: 4

runtime:
  default_input_resolution: 480
  default_inference_interval: 2
  default_cpu_threads: 3
  metrics_window_frames: 180
  pre_run_warmup_enabled: true
  pre_run_warmup_settle_sec: 2.0
  pre_run_warmup_full_runs: 1
  pre_run_warmup_roi_runs: 1
  pre_run_warmup_resolution: 640
  pre_run_warmup_threads: 4
  pre_run_warmup_roi_resolution: 320
  warmup_governor: performance

thermal:
  normal_max_c: 58.0
  warm_max_c: 66.0
  critical_c: 76.0
  hysteresis_c: 5.0
  warm_hold_frames: 180
  hot_hold_frames: 300
  critical_hold_frames: 450
  warm_hold_sec: 30.0
  hot_hold_sec: 45.0
  critical_hold_sec: 60.0
  critical_plus_delta_c: 2.0
  critical_max_delta_c: 5.0
  pressure_hysteresis_c: 2.0
  pressure_hold_frames: 180
  pressure_hold_sec: 45.0
  target_c: 80.0
  recovery_slope_c_per_min: -0.15
  preemptive_slope_c_per_min: 0.4
  balanced_interval_cap: 12

fan:
  enabled: true
  enabled_strategies: ["scene_thermal_interval_lk", "scene_thermal_coadaptive"]
  gpio_mode: BCM
  pwm_pin: 18
  pwm_frequency_hz: 1000
  on_temp_c: 68.0
  off_temp_c: 62.0
  full_temp_c: 82.0
  min_duty_cycle: 0.35
  max_duty_cycle: 1.0
  hold_low_on_close: true

camera:
  backend: csi
  csi_width: 640
  csi_height: 480
  csi_framerate: 30

inference:
  model_path: models/rtdetr_r18_lite_pi4_640.onnx
  model_paths_by_resolution:
    320: models/rtdetr_r18_lite_pi4_320.onnx
    480: models/rtdetr_r18_lite_pi4_480.onnx
    640: models/rtdetr_r18_lite_pi4_640.onnx
  enable_thread_sessions: false
  thread_session_counts: [1, 2, 3, 4]
  inter_op_num_threads: 1
  execution_mode: sequential
  graph_optimization_level: all
  enable_cpu_mem_arena: true
  enable_mem_pattern: true
  warmup_runs: 1
  warmup_resolutions: [640, 320]
  warmup_threads: [0]

os_control:
  apply_runtime_actions: false
