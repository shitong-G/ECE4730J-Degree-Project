strategy:
  name: scene_track_lk
  description: Scene-aware temporal reuse policy using RT-DETR keyframes plus Lucas-Kanade box tracking

policy:
  use_scene: true
  use_thermal: false
  fixed_inference_interval: null
  fixed_input_resolution: null
  fixed_cpu_threads: null
  fixed_cpu_affinity: null
  fixed_governor: null

runtime:
  default_input_resolution: 640
  default_inference_interval: 1
  default_cpu_threads: 4

scene_policy:
  # Keep the detector at 640; scene-aware savings come from temporal reuse, not
  # from changing model resolution.
  light_resolution_steps: 0
  medium_resolution_steps: 0
  heavy_resolution_steps: 0
  light_interval_min: 1
  medium_interval_min: 1
  heavy_interval_min: 1
  light_thread_cap: 4
  medium_thread_cap: 4
  heavy_thread_cap: 4
  light_governor: performance
  medium_governor: performance
  heavy_governor: performance
  light_query_budget: 200
  medium_query_budget: 240
  heavy_query_budget: 300
  light_decoder_layers: 6
  medium_decoder_layers: 6
  heavy_decoder_layers: 6

tracking:
  enable_lk_tracking: true
  scene_event_triggered: true
  lk_force_refresh_on_failure: true
  safety_refresh_frames: 300
  safety_refresh_defer_when_healthy: true
  safety_refresh_hard_limit_frames: 900
  safety_refresh_healthy_max_failure_ratio: 0.05
  safety_refresh_healthy_min_quality: 0.75
  lk_max_failure_ratio: 0.30
  lk_min_valid_points: 4
  lk_min_survival_ratio: 0.35
  lk_max_forward_backward_error: 1.5
  lk_max_corners: 24
  lk_win_size: 15
  lk_max_level: 2
  lk_max_iterations: 15
  lk_grid_size: 3
  lk_robust_mad_multiplier: 2.5
  lk_redetect_interval: 5
  lk_redetect_min_points: 8
  lk_edge_refresh_margin_ratio: 0.02
  lk_min_refresh_point_span_ratio: 0.18
  lk_edge_exit_frames: 8
  lk_edge_exit_min_area_ratio: 0.03
  lk_exit_refresh_min_area_ratio: 0.01
  lk_large_track_refresh_frames: 30
  lk_large_track_refresh_area_ratio: 0.08
  lk_quality_confirm_enabled: true
  lk_quality_confirm_frames: 1
  lk_quality_confirm_max_failure_ratio: 0.60
  lk_quality_confirm_min_survivors: 1
  roi_refresh_enabled: true
  roi_refresh_resolution: 320
  roi_refresh_expand_ratio: 1.8
  roi_refresh_max_area_ratio: 0.25
  roi_refresh_max_failure_ratio: 0.60
  roi_refresh_min_survivors: 1
  roi_refresh_lk_quality_enabled: false
  roi_refresh_lk_max_failed_boxes: 1
  roi_refresh_lk_max_failure_ratio: 0.40
  roi_refresh_lk_max_area_ratio: 0.18
  roi_slow_fuse_enabled: true
  roi_slow_fuse_threshold_ms: 8000
  roi_slow_fuse_consecutive_limit: 2
  roi_slow_fuse_cooldown_frames: 45
  gate_width: 320
  motion_threshold: 24
  outside_ratio_threshold: 0.010
  min_component_area: 120
  scene_change_ratio_threshold: 0.35
  mask_expand_ratio: 0.28
  disable_camera_compensation: false
